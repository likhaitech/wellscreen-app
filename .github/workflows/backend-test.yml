name: Backend Tests

# Runs the backend pytest suite when backend files change.
# Pushes to any branch are supported, while pull requests target main.
# Firebase-related dependencies are mocked in the tests, so a real
# Firebase project or Android emulator is not required.

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'

  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'

  workflow_dispatch: {}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest tests/ -v
