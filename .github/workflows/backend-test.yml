name: Backend Tests

# Runs the backend's pytest suite (backend/tests/) on every push/PR that
# touches the backend, so the admin-auth revocation logic, user-admin
# service, and settings/logs services are verified by actual execution
# instead of manual read-through. See backend/tests/conftest.py for how
# Firebase Admin is mocked - no real service account or network access is
# needed for any of this to run.
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch: {}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest tests/ -v
