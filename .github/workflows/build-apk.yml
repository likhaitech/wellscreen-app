name: Build APK

# Runs Flutter analysis, tests, and APK compilation on pushes to main
# and pull requests targeting main. This verifies that the application
# can be analyzed, tested, and built before code is merged.

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch: {}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Write Firebase config
        # google-services.json is gitignored and must be supplied
        # through the GOOGLE_SERVICES_JSON_BASE64 repository secret.
        # Without this configuration, the APK build may fail during
        # the Google Services processing task.
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret is not set - the release APK build below will fail at :app:processReleaseGoogleServices. Add it under Settings > Secrets and variables > Actions."
          fi

      - name: Build release APK
        # Builds the release variant. Without an external release
        # keystore, the existing Gradle configuration may use
        # debug signing. This is for build verification, not publishing.
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wellscreen-debug-signed-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
