name: app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1

  app_usage: ^4.1.0
  usage_stats: ^2.0.1
  flutter_local_notifications: ^22.0.1

  get_it: ^9.2.1
  dio: ^5.9.2
  shared_preferences: ^2.5.5

  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  permission_handler: ^11.3.1
  connectivity_plus: ^7.3.1

  # Report export (see lib/services/report_export_service.dart): pdf builds
  # the PDF in-memory, path_provider finds a writable temp directory to
  # save it to, share_plus hands it to the platform share sheet so a
  # guardian can save it or send it elsewhere.
  #
  # share_plus is pinned to ^13.3.0, not the newest release at the time
  # this was added (^10.1.4) - `flutter pub get` in CI (Build APK run #34)
  # failed version solving: share_plus <13.0.0 depends on win32 ^5.5.3,
  # which conflicts with geolocator ^14.0.3's transitive dependency chain
  # (geolocator -> geolocator_linux -> package_info_plus >=10.0.0 ->
  # win32 ^6.0.0). ^13.3.0 is pub's own suggested resolution
  # (`flutter pub add share_plus:^13.3.0`); Share.shareXFiles()'s
  # signature and ShareResult return type - what report_export_service.dart
  # actually calls - have been stable since well before 10.x, so this is a
  # constraint bump, not an API migration.
  pdf: ^3.11.3
  path_provider: ^2.1.5
  share_plus: ^13.3.0

  # QR pairing (device_pairing_screen.dart generates, qr_scan_screen.dart /
  # child_home_screen.dart scans) - a faster alternative to typing the
  # 6-digit pairing code by hand. Wraps the existing pairing_codes flow;
  # does not change what data is trusted or how a code is validated.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/wellscreen_icon.png
    - assets/ml/forest_rules.json
    - assets/site_categories/cleaned_site_categories.csv
    - assets/site_categories/category_classifier_weights.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/wellscreen_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/wellscreen_icon.png"
  min_sdk_android: 23