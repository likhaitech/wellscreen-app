
# This file configures the Dart analyzer for the WellScreen Flutter app.
# It checks for errors, warnings, and lints.

# Recommended Flutter lint rules.
include: package:flutter_lints/flutter.yaml

# Analyzer configuration.
analyzer:
  errors:
    # Ignore deprecation notices, including the current
    # package:flutter/material.dart deprecation messages.
    # Other analyzer errors and warnings remain enabled.
    deprecated_member_use: ignore

# Project lint rules.
linter:
  rules:
    # avoid_print: false
    # prefer_single_quotes: true
